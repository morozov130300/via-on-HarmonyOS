name: public-sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出私有主仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 剔除敏感路径并推送到公开仓
        env:
          TOKEN: ${{ secrets.PUBLIC_SYNC_TOKEN }}
          PUBLIC_REPO: morozov130300/via-on-HarmonyOS
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::缺少 secrets.PUBLIC_SYNC_TOKEN，请在仓库 Settings → Secrets → Actions 中配置"
            exit 1
          fi

          git config user.name "public-sync-bot"
          git config user.email "public-sync-bot@users.noreply.github.com"

          # 1) 用独立 index 计算剔除敏感路径后的 tree
          export GIT_INDEX_FILE="$RUNNER_TEMP/sync.index"
          git read-tree HEAD
          for p in .env AGENTS.md build-profile.json5 local.properties; do
            git update-index --force-remove -- "$p" 2>/dev/null || true
          done
          git ls-tree -r -z --name-only HEAD \
            | tr '\0' '\n' \
            | grep -E '^signing/' \
            | while IFS= read -r p; do
                git update-index --force-remove -- "$p"
              done || true
          TREE=$(git write-tree)
          unset GIT_INDEX_FILE

          # 2) 取公开仓当前头作为父提交
          git fetch --no-tags \
            "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" \
            main:refs/remotes/public/main || true
          PARENT=""
          if git rev-parse --verify -q refs/remotes/public/main >/dev/null; then
            PARENT=$(git rev-parse refs/remotes/public/main)
          fi

          # 3) 内容无变化直接跳过
          if [ -n "$PARENT" ] && [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then
            echo "公开内容无变化，跳过"
            exit 0
          fi

          # 4) 生成提交并推送
          MSG=$(git log -1 --format=%s HEAD)
          if [ -n "$PARENT" ]; then
            COMMIT=$(printf '%s\n' "$MSG" | git commit-tree "$TREE" -p "$PARENT")
          else
            COMMIT=$(printf '%s\n' "$MSG" | git commit-tree "$TREE")
          fi

          git push "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" "${COMMIT}:main"
          echo "已推送到公开仓 ${PUBLIC_REPO}:main → ${COMMIT}"
